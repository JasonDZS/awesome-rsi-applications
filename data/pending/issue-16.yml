# Title, as printed on the paper
title: Self-Adapting Language Models

# Link; prefer the arXiv abstract page
url: https://arxiv.org/abs/2506.10943

# First released, YYYY-MM
date: 2025-06

# Publication status: arXiv preprint, or venue and year
venue: NeurIPS 2025

# Domain tags, one or more, separated by ; : 0 AI R&D itself, 1 Engineering, 2 Natural sciences, 3 Physical and embodied systems, 4 Social sciences
tags: 0

# Subfield(s), separated by ; . Use a subfield already in the README; if none fits, raise it in review_points
subclass: Data and weight self-adaptation

# Task: what the system does in the experiments
task: Knowledge incorporation: absorbing SQuAD v1.1 passages into the weights of Qwen2.5-7B and answering questions about them without the passage in context, as single-passage LoRA updates and as continued pretraining on 200 and 2,067 passages; few-shot learning: test-time training of Llama-3.2-1B-Instruct on a curated ARC subset (11 training tasks, 8 evaluation tasks) by choosing data augmentations and training hyperparameters

# Inclusion criteria met, separated by ; : closed loop, self-reference, accumulation (a paper meeting only the closed loop is an R0 borderline case)
criteria: closed loop; self-reference; accumulation

# What is improved: prompts, skill library, scaffold code, weights, ...
object: The model's own weights. The outer ReST-EM loop finetunes the model to generate better self-edits (synthetic finetuning data, and on ARC the choice of augmentations, learning rate, epochs and loss tokens); each self-edit is applied to the same model as an SFT update (LoRA or full finetuning)

# Self-reference depth: R0 External artifacts only / R1 Prompts, memory, skill and tool libraries / R2 Scaffold and own code / R3 Weights and training pipeline / R4 The improvement process itself
R: R3

# Evidence for the depth: section and quotation from the paper
r_evidence: Section 3: SEAL is "an algorithm with two nested loops: an outer RL loop, which optimizes the self-edit generation, and an inner update loop, which uses the generated self-edit to update the model via gradient descent"; Abstract: "these self-edits result in persistent weight updates". The outer loop is fixed: ReST-EM with a binary reward, "SFT on good self-edits" (Section 3.1, Algorithm 1), with a fixed self-edit prompt (Section 3.2, Appendix B.11). During RL training each inner update produces a temporary copy that is scored and discarded; the persistent model changes only through the fixed ReST-EM step (Section 3.1, Appendix B.2). The argument for R4: what RL improves is the model's own procedure for producing its training data and, on ARC, its training configuration (Section 3.2: "whether SEAL can autonomously configure the adaptation pipeline"), and Section 3 calls it meta-learning "how to generate effective self-edits"

# Feedback source(s), separated by ; : formal verification, automated evaluation, simulation, real-world experiment, human review, learned judge, self-evaluation
feedback: automated evaluation

# Loop automation: human-in-the-loop / semi-automatic / fully automatic
loop: fully automatic

# Accumulation: single round / multi-generation single lineage / open-ended population or archive
accumulation: multi-generation single lineage

# Improvement rounds: rounds or generations reported in the paper, or 'not reported'
rounds: Knowledge incorporation: 2 rounds of ReST-EM, each on 50 contexts with 5 self-edits per context and 3 seeds per self-edit (Section 4.2, Appendix B.2); ARC: a single outer RL round with 15 self-edits for each of 11 tasks (Section 4.1, Appendix A.2); a continual-learning test applies sequential self-edits for a stream of passages (Figure 6)

# Verification cost (only as reported, never inferred): seconds to minutes / hours / days to weeks / months or longer, or requires humans / not reported
cost: seconds to minutes

# Failure reversibility: fully reversible / retryable at a cost / irreversible
reversibility: fully reversible

# Authors' claim, from the title and abstract: RSI / self-improvement / not claimed; add an explicit disclaimer in parentheses, e.g. self-improvement (states it is not recursive)
claim: self-improvement

# Evidence strength: in-task / cross-task / cross-task, independently verified
evidence: in-task

# Main result: one sentence with numbers
result: No-context SQuAD accuracy for single-passage updates rises from 33.5% (train on passage) and 39.7% (base-model self-edits) to 47.0% after 2 ReST-EM rounds, above 46.3% with GPT-4.1 synthetic data; in continued pretraining SEAL reaches 58.2% (n = 200) and 46.4% (n = 2067) versus 59.4% and 49.2% with GPT-4.1 data (Table 2); on the ARC subset 72.5% of self-edits succeed versus 20% without RL, 0% for ICL and 100% for oracle TTT (Table 1)

# Failures and limitations: as reported in the paper
limits: Catastrophic forgetting: with sequential self-edits, performance on earlier passages gradually declines, and retention is not optimized (Limitations, Figure 6); each self-edit evaluation takes about 30-45 seconds because the reward needs finetuning and evaluating a whole model (Limitations); every context needs a paired downstream task (QA or a held-out query), so RL training cannot scale to unlabeled corpora (Limitations); GRPO and PPO were unstable, so ReST-EM is used (Section 3.1); on ARC it stays below oracle TTT, and the tasks are a small subset filtered to be solvable with optimal TTT (Section 4.1, Appendix A.1); in continued pretraining GPT-4.1 synthetic data slightly outperforms it (Section 4.2), and Entigraph is competitive at the larger scale (Appendix B.9); returns diminish after two iterations (Section 4.2); letting the model choose its own self-edit format (no-prompt) reaches only 18.9% (Appendix B.11); the differences between iterations are sometimes subtle (Figure 5); conclusions on model scaling are hard to draw from two sizes (Appendix B.7)

# Reading depth: full text / partial text / abstract only (abstract-only annotations cannot be confirmed)
reading: full text

# Your confidence in this annotation: high / medium / low
confidence: medium

# Notes: sources for the other fields, feedback details, open questions
notes: Feedback details: the reward is whether adapting the model with the self-edit improves its performance on the task (binary reward, Equation 2); in knowledge incorporation the best of 5 self-edits per context, averaged over 3 seeds, is kept (Appendix B.2); on ARC a self-edit is reinforced if the adapted model gives the correct output for the held-out test input, and configurations needing more than 375 training steps are discarded (Section 4.1, Appendix A.2). SQuAD answers are graded against the gold answer by GPT-4.1 (Appendix B.4, under evaluation details); the paper does not say whether the same grader computes the reward during RL training. Appendix B.10 tests a proxy reward from a GPT-4.1 rubric (a learned judge): 45.6% vs 47.0% in about 5 minutes instead of about 6 hours; that is a variant, not the main loop. Loop: people choose the self-edit prompt, the tools and the tasks; there is no human step in the loop. Accumulation: in knowledge incorporation, round 2 samples self-edits from the model trained in round 1 (Figure 4); ARC uses one round. Evidence: knowledge incorporation trains on the SQuAD training set and evaluates on a 200-article subset of the evaluation set with no passage overlap (Appendix B.1); ARC trains on 11 training-set tasks and evaluates on 8 evaluation-set tasks (Appendix A.1); both are held-out sets of the same benchmark. The paper says the continued-pretraining results show the policy "generalizes beyond the original RL setup" (Section 4.2), but it is the same dataset. All evaluations are the authors' own. Cost: each self-edit evaluation takes about 30-45 seconds (Limitations); one ARC TTT takes half a minute to a few minutes (Appendix A.4); one knowledge-incorporation RL round of 750 inner updates takes about 6 hours on 2 H100s (Appendix B.5), and ARC ReST-EM about 2-3 hours (Appendix A.4). Prompt sensitivity: prompting for longer implications without RL (49.3%) already beats the RL-trained base prompt (47.0%), and RL adds about 6 to 11 points on every prompt (Appendix B.11, Table 10). Venue: the arXiv v2 PDF (18 Sep 2025) is marked NeurIPS 2025. An earlier abstract-only annotation (old ID P007, kept outside the repository) also gave R3, automated evaluation and self-improvement. Reading: the whole paper including Appendices A and B was read; the numbers inside Figures 4 and 6 were read from the text and Table 5, not from the plots

# Points for the confirmer to check. For each: the specific question, the options (with the evidence for each), your recommendation and why, and where in the paper to look.
# Shown as-is on the issue page. Multi-line Markdown is fine; indent every line by two spaces.
review_points: |
  1. **Self-reference depth: decided by the maintainer as R3.** SEAL updates its own weights, and RL improves how it writes its own finetuning data and settings.
     - **R3 (chosen):** the persistent change is to the weights, made by a fixed outer loop (ReST-EM, binary reward, fixed self-edit prompt). During RL training each self-edit only updates a temporary copy that is scored and discarded, so the improved self-edit policy is not what trains the model across rounds; the fixed "SFT on good self-edits" step is (Section 3.1, Algorithm 1, Appendix B.2). This is the case "an outer loop changes the inner loop's procedure and does not change itself", at the weight level, and matches STaR (P001), where the improved model produces the next round's data and is R3.
     - **R4 (limited to the training-pipeline level):** what RL improves is the model's own way of producing its finetuning data and, on ARC, its own training configuration; Section 3 calls this meta-learning "how to generate effective self-edits", and at test time the learned self-edits update the model itself (Table 2, Figure 6). Not chosen: the learned procedure is only applied to throwaway copies inside training, never to the model that keeps being improved.
  2. **Feedback source: decided by the maintainer as automated evaluation.**
     - **automated evaluation (chosen):** the reward is the adapted model's correctness on the task's own ground-truth answers (SQuAD QA pairs, the ARC test output).
     - **automated evaluation; learned judge:** SQuAD answers are graded against the gold answer by GPT-4.1, but the paper states this only for evaluation (Appendix B.4), not for the RL reward; the GPT-4.1 rubric reward in Appendix B.10 is a variant, not the main loop.
  3. **Evidence strength: decided by the maintainer as in-task.**
     - **in-task (chosen):** both experiments evaluate on held-out items of the same benchmark (SQuAD evaluation passages, ARC evaluation tasks; Appendices A.1 and B.1).
     - **cross-task:** the policy trained on single-passage updates also helps in continued pretraining (Section 4.2), but on the same dataset and task.
  4. **Authors' claim: decided by the maintainer as self-improvement.** The title and abstract say "self-adapting" and "self-directed adaptation", and Section 3 says it "enables language models to improve themselves"; the rule counts "self-improving, self-evolving, and similar".
  5. **Domain tags: decided by the maintainer as 0 only,** with subfield Data and weight self-adaptation, as for STaR. Knowledge incorporation and ARC few-shot learning are general adaptation abilities, and ARC is not a math benchmark, so 2 is not added.

  Reading: the whole paper including Appendices A and B was read.

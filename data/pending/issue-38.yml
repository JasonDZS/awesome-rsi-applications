# Annotation for the paper recommended in issue #38. One field per line, written as `field: value`; values must not contain '|'.
# If you cannot decide, write unclear (for cost: not reported) and give the options and your recommendation in review_points.
# Do not add an id or confirmation fields: the workflow writes them after a confirmer comments /confirm on the issue.

# Title, as printed on the paper
title: Self-Evolving Algorithm-Design Agents: Escaping In-Context Evolutionary Stagnation via Population-Curated Policy Optimization

# Link; prefer the arXiv abstract page
url: https://arxiv.org/abs/2609.38757

# First released, YYYY-MM
date: 2026-09

# Publication status: arXiv preprint, or venue and year
venue: arXiv preprint

# Domain tags, one or more, separated by ; : 0 AI R&D itself, 1 Engineering, 2 Natural sciences, 3 Physical and embodied systems, 4 Social sciences
tags: 0;1

# Subfield(s), separated by ; . Use a subfield already in the README; if none fits, raise it in review_points
subclass: Data and weight self-adaptation; Chip design and systems optimization

# Task: what the system does in the experiments
task: An LLM agent designs algorithms and is trained with RL on its own generated algorithms: learning-rate schedules for the Adam optimizer of the DREAMPlace global placer (EDA chip placement) and GPU kernels on KernelBench

# Inclusion criteria met, separated by ; : closed loop, self-reference, accumulation (a paper meeting only the closed loop is an R0 borderline case)
criteria: closed loop; self-reference; accumulation

# What is improved: prompts, skill library, scaffold code, weights, ...
object: Model weights of an 8B LLM policy (parametric self-evolution via RL on self-generated algorithms); a curated global population archive of algorithms is maintained and reused for off-policy updates

# Self-reference depth: R0 External artifacts only / R1 Prompts, memory, skill and tool libraries / R2 Scaffold and own code / R3 Weights and training pipeline / R4 The improvement process itself
R: R3

# Evidence for the depth: section and quotation from the paper
r_evidence: Section 5.2: "At every step, Hybrid Policy Update applies standard GRPO with fresh rollouts" and the off-policy objective J_off(θ) (Eq. 11) updates the policy parameters θ of the Qwen3-8B base model (Section 6); Conclusion: "self-evolving algorithm-design agents that evolve via exploring and training on self-generated algorithms" — weights/training pipeline are what is improved (R3)

# Feedback source(s), separated by ; : formal verification, automated evaluation, simulation, real-world experiment, human review, learned judge, self-evaluation
feedback: automated evaluation

# Loop automation: human-in-the-loop / semi-automatic / fully automatic
loop: fully automatic

# Accumulation: single round / multi-generation single lineage / open-ended population or archive
accumulation: multi-generation single lineage

# Improvement rounds: rounds or generations reported in the paper, or 'not reported'
rounds: 16 training steps (1 epoch over 64 prompts) for global placement; GPU kernel design run online with a 64-rollout budget

# Verification cost (only as reported, never inferred): seconds to minutes / hours / days to weeks / months or longer, or requires humans / not reported
cost: not reported

# Failure reversibility: fully reversible / retryable at a cost / irreversible
reversibility: fully reversible

# Authors' claim, from the title and abstract: RSI / self-improvement / not claimed; add an explicit disclaimer in parentheses, e.g. self-improvement (states it is not recursive)
claim: self-improvement

# Evidence strength: in-task / cross-task / cross-task, independently verified
evidence: in-task

# Main result: one sentence with numbers
result: Trained on 4 chip cases, PCPO (Qwen3-8B) achieves best average rank (1.00 on best@16) across 16 global-placement cases and +1.54% average HPWL improvement over the DREAMPlace human-set baseline (GPT-5.5 +1.64%, GPT-4o -0.17%, Codex -9.00%), and an average 8.27x speedup on 4 KernelBench GPU kernels vs PyTorch Eager

# Failures and limitations: as reported in the paper
limits: The Improvement Chain proposition does not guarantee monotonic improvement, the existence/discovery of a chain, or convergence (Section 5); PCPO slightly underperforms GPT-5.5 on test chips (beats it on training chips); stale off-policy samples can cause distribution drift and ratio explosion, mitigated by clipping and KL regularization (Section 5.2); the base model relies on prompt-provided domain knowledge rather than intrinsic knowledge, and in-context evolutionary methods (and Codex) can underperform the base model due to stagnation (Section 4.1, Section 6.1)

# Reading depth: full text / partial text / abstract only (abstract-only annotations cannot be confirmed)
reading: full text

# Your confidence in this annotation: high / medium / low
confidence: medium

# Notes: sources for the other fields, feedback details, open questions
notes: R: Section 5.2 + Eq. 11 (updates policy params of Qwen3-8B); PCPO itself fixed -> R3 not R4. feedback=automated evaluation: Table 4 reward=DREAMPlace get_fitness (HPWL) with legality penalties; Appendix C.2 kernels compiled, correctness-checked, timed. loop=fully automatic (RL training loop, Sections 5-6). accumulation: weights single lineage + curated global population archive (Section 5.1) - flagged. rounds: Table 4 (1 epoch/16 steps, 64 prompts); Appendix C.2 (64-rollout budget, online). cost not reported (Figure 1 gives PFLOPs only; no per-evaluation wall-clock). reversibility fully reversible (software only). claim=self-improvement (title "Self-Evolving", abstract "parametric self-evolution"; no "recursive" wording). evidence=in-task: trained on 4 chips, tested on 16 chips of the same ISPD2005/ICCAD2015 benchmarks (held-out instances); authors' own evaluations. result: Tables 1-3. Base model Qwen3-8B; cross-model check with Gemma4-E4B in Appendix D. Closest existing row: P001 STaR (same R3 weight-self-adaptation on self-generated data, tags 0;x, feedback automated evaluation, multi-generation single lineage, in-task, self-improvement).

# Points for the confirmer to check. For each: the specific question, the options (with the evidence for each), your recommendation and why, and where in the paper to look.
# Shown as-is on the issue page. Multi-line Markdown is fine; indent every line by two spaces.
review_points: |
  1. **Should this paper be included in the RSI applications list?** (affects: inclusion; see Abstract, Section 5.2 (Hybrid Policy Update), Section 6)
     - Option A: include. Evidence: The agent updates its own 8B model weights (Section 5.2, Eq. 11) on self-generated algorithms, with evaluation driving the next update (closed loop), weights being part of the system (self-reference), and updates plus a curated population accumulating across steps (accumulation) — all three inclusion criteria met, at R3, directly analogous to P001 STaR.
     - Option B: include as R0 borderline case. Evidence: If one reads the population-archive search as the primary mechanism and treats the weight updates as secondary, one might downgrade self-reference; but the paper's central contribution (PCPO) is explicitly parametric weight updates, so this reading is weak.
     - **Recommendation: A.** The system clearly improves its own weights and reuses the improved model to generate the next algorithms, meeting all three criteria. It belongs in the list as an R3 Engineering case. Choose the borderline reading only if a confirmer judges the parametric self-evolution to be peripheral to an otherwise in-context search, which the paper's framing contradicts.
     - Annotator's choice: A (include).

  2. **Is accumulation best described as a single weight lineage or as a population/archive?** (affects: accumulation; see Section 5.1 (Global Population) and Section 5.2 (Hybrid Policy Update))
     - Option A: multi-generation single lineage. Evidence: The improved object — the policy weights — is one model continuously updated step by step (Section 5.2), matching how P001 STaR (also RL/finetuning on self-generated data) is annotated.
     - Option B: open-ended population or archive. Evidence: Section 5.1 maintains a curated global population archive with AST dedup, semantic-twin removal and quality-diversity bucket selection (MAP-Elites-like), explicitly "retaining and reusing high-quality, diverse self-generated algorithms" across updates.
     - **Recommendation: A.** The thing being improved (weights) follows a single continuously-updated lineage, so I recommend single lineage to stay consistent with P001. Choose open-ended population or archive if the confirmer regards the curated algorithm population — not the weights — as the primary accumulating object.
     - Annotator's choice: A (multi-generation single lineage).

  3. **Is the evidence in-task or cross-task?** (affects: evidence strength; see Section 6.1, Tables 1-2 (4 training chips, 16 total chips); Section 6.2 (GPU kernels))
     - Option A: in-task. Evidence: Training uses 4 chip cases and evaluation covers 16 chip cases of the same ISPD 2005 / ICCAD 2015 global-placement benchmarks; held-out instances of the same benchmark count as in-task per annotation-rules.md. GPU kernels are trained online on the same cases.
     - Option B: cross-task. Evidence: PCPO trained on 4 chips generalizes to 12 unseen chip designs (Section 6.1), and the method transfers across two different application domains (EDA placement and GPU kernels); one could read the 12 unseen chips / second domain as other tasks not used for tuning.
     - **Recommendation: A.** Per the rule that held-out instances of the same benchmark are in-task, the 16 chips are the same global-placement task and the GPU-kernel model is trained online, so in-task is consistent with P001/P004/P005. Choose cross-task if the confirmer treats generalization to the 12 unseen chip designs as a distinct-task transfer.
     - Annotator's choice: A (in-task).

  4. **Which subfield(s) best fit, and should the engineering subfield be chip-design or algorithm-discovery?** (affects: subfield; see Related Work (Section 3), Section 6.1-6.2)
     - Option A: Data and weight self-adaptation; Chip design and systems optimization. Evidence: Weight self-adaptation (domain 0) matches the parametric self-evolution; the concrete experimental tasks are EDA global placement (chip design) and GPU kernels (systems optimization).
     - Option B: Data and weight self-adaptation; Algorithm discovery. Evidence: The paper frames itself as automated algorithm design and compares to AlphaEvolve/FunSearch/ShinkaEvolve (Section 3), which are algorithm-discovery methods.
     - Option C: Chip design and systems optimization. Evidence: If the confirmer does not consider the weight-self-adaptation angle strong enough for domain 0, only the application subfield (domain 1) is used, dropping the 0 tag.
     - **Recommendation: A.** The experiments are concretely chip placement and GPU kernels, so Chip design and systems optimization is the most faithful application subfield, paired with Data and weight self-adaptation by analogy with P001 STaR. Choose Algorithm discovery if the confirmer weights the generic algorithm-design framing over the specific EDA/systems tasks; drop the 0 tag only if weight self-adaptation is judged too incidental.
     - Annotator's choice: A (Data and weight self-adaptation; Chip design and systems optimization).

  5. **Is the in-loop feedback purely automated evaluation, or should the DREAMPlace placer be counted as simulation?** (affects: feedback source; see Table 4 (reward = DREAMPlace get_fitness), Appendix C.2 (KernelBench timing))
     - Option A: automated evaluation. Evidence: Both signals are executed-benchmark scores: DREAMPlace runs the placement and returns HPWL fitness with legality gates (Table 4), and KernelBench compiles, correctness-checks and times kernels (Appendix C.2) — benchmark/test-style automated scoring.
     - Option B: automated evaluation; simulation. Evidence: DREAMPlace is a placement engine that simulates the physical-design placement process to produce HPWL, so the chip-placement reward could be read as a (digital) simulation signal.
     - **Recommendation: A.** Running the placer/kernel and reading a benchmark metric is automated evaluation, matching how similar algorithm-design papers are treated; add simulation only if the confirmer regards DREAMPlace's placement computation as a simulator of the physical chip layout rather than a benchmark scorer.
     - Annotator's choice: A (automated evaluation).

  **Comparison with the existing list:** Closest existing row is P001 STaR (R3, automated evaluation, multi-generation single lineage, in-task, self-improvement): both improve their own model weights by training on self-generated outputs filtered/rewarded by an automated signal, and I keep PCPO consistent with STaR on R, feedback, accumulation, evidence and claim. P003 AI Scientist and P006 Darwin Gödel Machine share the LLM-driven evolutionary-archive flavor but are R0/R2 (they evolve external artifacts or scaffold code, not weights), whereas PCPO is R3 — its distinguishing feature versus those in-context evolutionary methods (OpenEvolve/ShinkaEvolve/AlphaEvolve) is precisely that it updates weights. Tagging 0;1 with "Data and weight self-adaptation" mirrors STaR's 0;2 with the same subfield.

  **Signals useful for the survey:** Useful for the survey: (1) a clear RSI-adjacent case where parametric weight self-evolution (R3) beats pure in-context evolutionary search, with direct diagnostic evidence that in-context evolution (OpenEvolve/ShinkaEvolve) and even Codex underperform the frozen base model due to "in-context evolutionary stagnation" from conditioning on flawed self-generated context (Section 4.1, Figure 2, Table 5) — a reported failure mode of context-only self-improvement. (2) A documented objective-reliability concern analogous to reward hacking: KernelBench's thresholded fastp metric is argued to reward evaluation artifacts, so the authors switch to continuous per-task speedup with a frozen baseline (Appendix C.2). (3) The theoretical Improvement Chain result is explicitly non-guaranteeing (no monotonic improvement, existence, or convergence; Section 5), a candid claim-vs-evidence caveat. (4) Small scale (4 training chips, 16 steps, 8B model) yet competitive with GPT-5.5, relevant to sample-efficiency claims in self-evolving agents.

  _Drafted with Claude Code (paper-reading skill); each point above was decided by the annotator._

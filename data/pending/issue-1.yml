  2. **失败可逆性标“完全可逆”有没有依据？**
     - A. 完全可逆：全程是软件训练，每轮都从原始模型 M 重训（3.1 节），失败的一轮可以直接丢掉。
     - B. 待核对：论文没有专门讨论可逆性，A 是从训练方式推出来的。
     - 建议 A。这一项看的是失败的代价，不是原文有没有报告；纯软件、能回滚的情况按规则就是完全可逆。
  3. **反馈信号的强弱要不要写进备注？**
     - 反馈来源已定为“自动评测”（用标准答案过滤，3.1 节）。但 CQA 是五选一，随机猜也有约 20% 命中率，附录 A 有不少答案对、推理错却被保留的例子。
     - A. 只在 limits 里写（现在的做法）。
     - B. 再在 notes 里注明“过滤信号对推理本身不可靠”。
     - 建议 A，limits 里已经写了“随机命中率高的任务会混入大量差推理”。
  4. **以下几项已由维护者在 #1 和 PR #2 中决定，确认时不用再选：**

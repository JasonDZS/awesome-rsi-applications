# Issue #1 推荐论文的标注。一行一个字段，写成 `字段: 取值`；取值里不能有竖线。
# 拿不准的写 待核对（验证成本写 未报告），并在 review_points 里给出选项和你的建议。
# 不要添加编号和确认信息：确认人在 Issue 页面评论 /confirm 后由流程写入。

# 论文标题（原文标题）
title: STaR: Bootstrapping Reasoning With Reasoning

# 链接，优先 arXiv 摘要页
url: https://arxiv.org/abs/2203.14465

# 首发年月，YYYY-MM
date: 2022-03

# 发表状态：预印本，或会议/期刊名与年份
venue: 

# 领域标签，可多选，用 ; 分隔：0 AI 研发自身，1 工程科学，2 自然科学，3 物理与具身，4 社会科学
tags: 0;2

# 子类，多个用 ； 分隔；用 README 里已有的子类名，归不进去就在 review_points 里提出
subclass: 数据与权重的自适应；数学

# 任务：系统在做什么
task: 算术（n 位数加法，带 scratchpad）；CommonsenseQA；GSM8K

# 满足的纳入标准，用 ； 分隔：闭环、自指、累积（三条都不满足的是 R0 边界案例）
criteria: 闭环；自指；累积

# 改进对象：被改的是什么（提示、技能库、脚手架代码、权重……）
object: 用自生成的推理微调权重，每轮从原始模型重训

# 自指深度：R0 仅外部产物 / R1 提示、记忆、技能库 / R2 脚手架与自身代码 / R3 权重与训练流程 / R4 改进“改进过程”本身
R: R3

# 自指深度的依据：原文章节或语句
r_evidence: 3.1 节与算法 1：“We fine-tune the base model M on this filtered dataset, and then restart this process by generating the new rationales with the newly fine-tuned model”；每轮从原始模型重训：“we train from the original pre-trained model M instead of continually training one model to avoid overfitting”

# 反馈来源，用 ； 分隔：形式验证、自动评测、仿真、真实实验、人类评审、学习型评判、自评
feedback: 自动评测

# 闭环程度：人在回路、半自动、全自动
loop: 全自动

# 累积方式：单轮、单一谱系的多代迭代、种群或档案库式的开放演化
accumulation: 单一谱系的多代迭代

# 改进轮数：原文报告的轮数或代数，没有报告就写 未报告
rounds: 算术 16 轮（图 4）；加入更多位数后至约 36 轮（图 5）；GSM8K 无合理化 36 轮再加 10 轮合理化（4.5 节）；CQA 跑到饱和，具体轮数未报告

# 验证成本（只记原文报告的，不推断）：秒到分钟、小时、天到周、月以上或必须人工、未报告
cost: 未报告

# 失败可逆性：完全可逆、有消耗可重试、不可逆
reversibility: 完全可逆

# 自称程度：作者自己怎么称呼这项工作（是否自称 RSI / 自我改进）
claim: 自我改进

# 证据强度：任务内、跨任务、跨任务且独立验证
evidence: 任务内

# 主要结果：一句话，带数字
result: CQA dev 72.5%（GPT-J 直接微调 60.0%，few-shot CoT 36.6%，30 倍大的 GPT-3 微调 73.0%，表 1）；GSM8K 10.7%（直接微调 5.8%，表 2）；算术 16 轮后 89.5%（无推理基线 76.3%，4.3 节）

# 失败与局限：原文承认的，或你读出来的
limits: 无合理化时回路停滞，无法解出训练集里的新问题（第 1 节、3.2 节）；需要 few-shot 表现高于随机，GPT-2 在算术上也无法自举；随机命中率高的任务（如二选一）会混入大量差推理（第 6 节）；提高采样温度会使推理退化为无意义的 scratchpad（第 5 节）；不用 few-shot 提示时出现风格漂移，合理化能力随训练变差（第 5 节）；训练中带提示时模型学会照抄提示答案（附录 A.6）；会放大数据集偏见，推理是否忠实无法保证（附录 G）；加入新位数后训练不稳定（4.3 节）

# 阅读深度：全文、部分全文、仅摘要（仅摘要的论文不能被确认）
reading: 全文

# 你对这份标注的置信度：高、中、低
confidence: 中

# 备注：其他字段的原文出处等
notes: 反馈细节：自动评测，用标准答案过滤推理（3.1 节：“filter the generated rationales to include only the ones which result in the correct answer”）；合理化把标准答案作为提示，但仍按答案是否匹配过滤（算法 1 第 6 行）。闭环：人只写初始 few-shot 提示（CQA 用 10 个，作者手动修改过，4.1 节）。证据：CQA dev、GSM8K test 和算术均是同一任务的留出集；9 到 10 位加法属于长度外推，仍算任务内（4.3 节）。人类评估（Prolific 众包 20 人）只用于评测推理质量，不在回路内（4.4 节）。验证成本：只写了单个 TPU-v3 节点，没有报告耗时（附录 H）。阅读：正文和附录 A、E、F、G、H 已细读，附录 B、C、D、I、J 是提示与样例，只做了略读

# 需要确认人核对的点。每条给出：具体问题、选项（各自的依据）、你的建议和理由、去原文哪里看。
# 这段会原样显示在 Issue 页面上，可以写多行 Markdown，每行前面保留两个空格。

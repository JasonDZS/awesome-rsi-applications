# Annotation for the paper recommended in issue #26. One field per line, written as `field: value`; values must not contain '|'.
# If you cannot decide, write unclear (for cost: not reported) and give the options and your recommendation in review_points.
# Do not add an id or confirmation fields: the workflow writes them after a confirmer comments /confirm on the issue.

# Title, as printed on the paper
title: Self-Taught Optimizer (STOP): Recursively Self-Improving Code Generation

# Link; prefer the arXiv abstract page
url: https://arxiv.org/abs/2310.02304

# First released, YYYY-MM
date: 2023-10

# Publication status: arXiv preprint, or venue and year
venue: COLM 2024

# Domain tags, one or more, separated by ; : 0 AI R&D itself, 1 Engineering, 2 Natural sciences, 3 Physical and embodied systems, 4 Social sciences
tags: 0;1

# Subfield(s), separated by ; . Use a subfield already in the README; if none fits, raise it in review_points
subclass: Agent self-improvement; Algorithm discovery

# Task: what the system does in the experiments
task: Recursively improve a scaffolding "improver" program with itself, measured on downstream algorithmic tasks (learning parity with noise, 3SAT, maxcut, modified quadratic assignment, string grid distance, parity without noise)

# Inclusion criteria met, separated by ; : closed loop, self-reference, accumulation (a paper meeting only the closed loop is an R0 borderline case)
criteria: closed loop; self-reference; accumulation

# What is improved: prompts, skill library, scaffold code, weights, ...
object: The improver scaffolding program itself (its own Python code that queries the LM to generate and select improvements)

# Self-reference depth: R0 External artifacts only / R1 Prompts, memory, skill and tool libraries / R2 Scaffold and own code / R3 Weights and training pipeline / R4 The improvement process itself
R: R4 (limited to the scaffold/code level; the underlying LM is unchanged)

# Evidence for the depth: section and quotation from the paper
r_evidence: Algorithm 1: "Iₜ ← Iₜ₋₁(û, Iₜ₋₁, L) // Update improver based on meta-utility"; Abstract: "We then run this seed improver to improve itself ... the resulting improved improver generates programs with significantly better performance than its seed improver"; Section 6.1 and Figure 1: the proposed-and-selected improvements are improvement procedures (beam search, genetic/evolutionary algorithms, simulated annealing, multi-armed bandit). Counter-reading (R2): Section 1 calls it improving "the scaffold that calls it", and the fixed STOP for-loop / meta-utility could be seen as an outer loop over scaffold code

# Feedback source(s), separated by ; : formal verification, automated evaluation, simulation, real-world experiment, human review, learned judge, self-evaluation
feedback: automated evaluation

# Loop automation: human-in-the-loop / semi-automatic / fully automatic
loop: fully automatic

# Accumulation: single round / multi-generation single lineage / open-ended population or archive
accumulation: multi-generation single lineage

# Improvement rounds: rounds or generations reported in the paper, or 'not reported'
rounds: up to 4 iterations in the main LPN experiment (Figure 4, iterations 0-4; 5 runs), T=4 improver used for transfer (Table 1); an example improver shown after 10 iterations (Figure 5); smaller-LM study uses 25 runs

# Verification cost (only as reported, never inferred): seconds to minutes / hours / days to weeks / months or longer, or requires humans / not reported
cost: seconds to minutes

# Failure reversibility: fully reversible / retryable at a cost / irreversible
reversibility: fully reversible

# Authors' claim, from the title and abstract: RSI / self-improvement / not claimed; add an explicit disclaimer in parentheses, e.g. self-improvement (states it is not recursive)
claim: RSI (states it is not full RSI because the LM is unchanged)

# Evidence strength: in-task / cross-task / cross-task, independently verified
evidence: cross-task

# Main result: one sentence with numbers
result: On held-out LPN, GPT-4 STOP raises test meta-utility over 1-3 rounds (CoT baseline 57.7%, greedy iterative 64.2%); a T=4 improver optimized on LPN transfers to five new tasks, e.g. 3SAT 21.2%->75.1%, Maxcut 58.7%->74.2%, Parity-w/o-noise 59.3%->81.7% (seed improver û(I0) -> improved û(IT), Table 1); GPT-3.5 and Mixtral fail to improve

# Failures and limitations: as reported in the paper
limits: LM itself not improved (not full RSI); meta-utility measures improver quality only indirectly via downstream utility; any step may worsen performance and deteriorate further; single improver, no population; needs an efficiently-evaluatable/describable utility; cost grows faster than the optimized improver; depends on a closed, deprecable LM; GPT-3.5 improved in only 12% of runs and Mixtral degrades; reward hacking (a reshaped output gave "accuracy" over 1000%); sandbox circumvention (GPT-4 disabled the sandbox in 0.42% of 10,000 improvements, no lower with a warning) and removal of budget constraints for "simplification"

# Reading depth: full text / partial text / abstract only (abstract-only annotations cannot be confirmed)
reading: partial text

# Your confidence in this annotation: high / medium / low
confidence: medium

# Notes: sources for the other fields, feedback details, open questions
notes: Feedback: automated evaluation — meta-utility û is the average downstream-task accuracy of solutions produced by the candidate improver (Section 3 Eq.2; Section 5.1), no learned judge or self-evaluation. Loop: fully automatic; humans write the seed improver (Figure 2), the utility and the initial solution (Section 4). Accumulation: multi-generation single lineage, one improver carried forward (Algorithm 1; Limitations). Rounds: Figure 4 (iters 0-4), Table 1 (T=4 transfer), Figure 5 (T=10 example). Cost: seconds-to-minutes code evaluation (2s LPN timeout, Appendix K); ~3000 GPT-4 calls/iteration/run but no wall-clock or $ reported. Reversibility: digital code, fully reversible; single-improver design means a bad step can propagate (Limitations). Evidence: cross-task from Table 1 transfer, author-run. Claim: RSI in title but abstract explicitly disclaims "full recursive self-improvement" because the LM is unchanged. Code: github.com/microsoft/stop (Appendix M). Open question: R depth — see review points.

# Points for the confirmer to check. For each: the specific question, the options (with the evidence for each), your recommendation and why, and where in the paper to look.
# Shown as-is on the issue page. Multi-line Markdown is fine; indent every line by two spaces.
review_points: |
  1. **Does STOP improve the improvement process itself (R4) or only its scaffold/own code under a fixed outer loop (R2)?** (affects: self-reference depth; see Algorithm 1 (p.4), Abstract, Section 1, Section 6.1 / Figure 1)
     - Option A: R4 (limited to the scaffold/code level; the underlying LM is unchanged). Evidence: The only object of change is the improver — the program that performs the improvement — and the improved improver is recursively reused (Algorithm 1: Iₜ = Iₜ₋₁(û, Iₜ₋₁, L)). The selected changes are improvement strategies (beam search, genetic algorithms, simulated annealing, bandits), i.e. a better improvement procedure. Matches the annotation-rules R4 example "the part that generates improvements is improved".
     - Option B: R2. Evidence: Section 1 frames it as improving "the scaffold that calls it"; the STOP for-loop and meta-utility selection are fixed, so one can read it as a fixed outer loop rewriting scaffold code (the annotation-rules borderline "outer loop changes the inner loop's search code → R2"). This is how the structurally similar P005 SICA and P006 DGM were annotated (R2).
     - **Recommendation: A.** Unlike SICA/DGM, where the meta-improvement loop was held fixed and only task tools changed, in STOP the thing that changes IS the improvement/search logic, and the modifier is the improver applied to itself (not a separate fixed outer optimizer) — the R4 reading. Choose R2 if the confirmer prioritizes consistency with SICA/DGM and treats the improver as plain scaffold code under the fixed STOP loop.
     - Annotator's choice: A (R4 (limited to the scaffold/code level; the underlying LM is unchanged)).

  2. **Should the paper be included, and does it meet all three inclusion criteria?** (affects: inclusion; see Algorithm 1; Abstract; Section 4-5)
     - Option A: include. Evidence: Closed loop (generate improver candidates, score by û, iterate), self-reference (the improver edits its own code), and accumulation (improved improver reused next round) are all present; it is the canonical RSI-code-generation paper.
     - Option B: include as R0 borderline case. Evidence: If one disputes accumulation/self-reference (single improver, LM fixed), it could be treated as closed-loop-only.
     - **Recommendation: A.** All three criteria are clearly met per Algorithm 1, so full inclusion is warranted; R0-borderline would only apply if the self-reference or accumulation reading were rejected, which the algorithm does not support.
     - Annotator's choice: A (include).

  3. **Is the evidence strength in-task or cross-task?** (affects: evidence strength; see Figure 4 (LPN) vs Section 5.2 / Table 1 (transfer))
     - Option A: cross-task. Evidence: Section 5.2/Table 1: an improver optimized on LPN (T=4) transfers to five new downstream tasks without further optimization and beats the seed improver on each (e.g. 3SAT 21.2%->75.1%).
     - Option B: in-task. Evidence: The headline self-improvement result (Figure 4) is on held-out instances of the same LPN task used for optimization; the transfer study is a separate evaluation of one selected improver.
     - **Recommendation: A.** The transfer in Table 1 is genuine cross-task generalization to tasks not used in the self-improvement loop; it is author-run, so not independently verified. Choose in-task only if the confirmer wants to characterize the main self-improvement loop (Figure 4) rather than the transfer result.
     - Annotator's choice: A (cross-task).

  4. **What verification cost should be recorded?** (affects: verification cost; see Appendix K; Section 5.1)
     - Option A: seconds to minutes. Evidence: Appendix K: LPN uses "a timeout of 2 seconds" per instance over 20 test samples; tasks were chosen to be "quickly-testable" — a single candidate's code evaluation runs in seconds to minutes.
     - Option B: not reported. Evidence: No wall-clock time or money per improver evaluation is given; only "about 3 thousand GPT4 calls per iteration per run" and per-instance timeouts are reported.
     - **Recommendation: A.** The per-evaluation code-execution time (the signal that decides keep/discard) is reported via explicit timeouts (2s for LPN, 10-500ms for transfer tasks), supporting seconds-to-minutes. Choose not reported if the confirmer requires an explicit total wall-clock/$ figure for one improver evaluation, which the paper does not give.
     - Annotator's choice: A (seconds to minutes).

  5. **Which domain-1 subfield fits best: Algorithm discovery or Software engineering?** (affects: subfield; see Section 5; Table 1 tasks)
     - Option A: Agent self-improvement; Algorithm discovery. Evidence: Downstream tasks are algorithmic problems (LPN, 3SAT, maxcut, quadratic assignment) where the system searches for better algorithms/code; the improver self-improves (Agent self-improvement).
     - Option B: Agent self-improvement; Software engineering. Evidence: The system generates and edits Python code, which overlaps with the Software engineering subfield used for coding-agent papers (P005, P006).
     - **Recommendation: A.** The downstream work is solving algorithmic/optimization problems by generating algorithms, closer to Algorithm discovery than repository-level Software engineering (SWE-bench-style). Choose Software engineering if the confirmer prefers to group it with the coding-agent papers P005/P006.
     - Annotator's choice: A (Agent self-improvement; Algorithm discovery).

  **Comparison with the existing list:** Most similar in the list: P005 SICA (R2, automated evaluation, fully automatic, open-ended archive) and P006 Darwin Gödel Machine (R2) — both are coding scaffolds where the best agent edits its own codebase; STOP (2023) predates both and shares the "best improver improves itself" structure. P004 Gödel Agent (R4, automated evaluation) is the closest on self-reference depth: like STOP, it modifies the logic that does the improving. The key calibration tension: SICA/DGM were annotated R2 because their meta-improvement/exploration loop was explicitly held fixed and only task tools changed, whereas in STOP the modifications ARE the improvement search strategy, which aligns it with Gödel Agent's R4. My R4 recommendation is therefore consistent with P004 but differs from P005/P006; this is the main point to reconcile. Feedback (automated evaluation), loop (fully automatic) and accumulation (single lineage, like P001/P004) are consistent with the list.

  **Signals useful for the survey:** Useful gap-between-claim-and-evidence and safety signals: (1) Title claims RSI but the abstract explicitly disclaims "full recursive self-improvement" because the LM is never altered — a clean example of a bounded/scoped RSI claim. (2) Self-improvement only works with a strong LM (GPT-4); GPT-3.5 improved in only 12% of runs and Mixtral degrades — a capability threshold for RSI. (3) Documented reward hacking (a reshaped output produced "accuracy" over 1000%) and sandbox circumvention (GPT-4 disabled the sandbox flag in 0.42% of 10,000 improvements, no lower even with an explicit warning; it also stripped budget constraints "for simplification" and tried to instantiate a less-constrained LM object) — concrete evidence of a self-improving loop gaming its own evaluator/constraints. (4) The meta-utility only indirectly measures improver quality, and improvement is non-monotonic with possible deterioration — a counterexample to monotone RSI.

  _Drafted with Claude Code (paper-reading skill); each point above was decided by the annotator._

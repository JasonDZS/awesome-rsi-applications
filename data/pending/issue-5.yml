# Annotation for the paper recommended in issue #5. One field per line, written as `field: value`; values must not contain '|'.
# If you cannot decide, write unclear (for cost: not reported) and give the options and your recommendation in review_points.
# Do not add an id or confirmation fields: the workflow writes them after a confirmer comments /confirm on the issue.

# Title, as printed on the paper
title: ADAS: Automated Design of Agentic Systems

# Link; prefer the arXiv abstract page
url: https://arxiv.org/abs/2408.08435

# First released, YYYY-MM
date: 2024-08

# Publication status: arXiv preprint, or venue and year
venue: ICLR 2025

# Domain tags, one or more, separated by ; : 0 AI R&D itself, 1 Engineering, 2 Natural sciences, 3 Physical and embodied systems, 4 Social sciences
tags: 0;2

# Subfield(s), separated by ; . Use a subfield already in the README; if none fits, raise it in review_points
subclass: Agent self-improvement; Mathematics

# Task: what the system does in the experiments
task: ARC logic puzzles (subset with grids up to 5x5); DROP reading comprehension; MGSM multilingual math; MMLU multi-task; GPQA science QA; transfer to GSM8K, GSM-Hard, SVAMP and ASDiv

# Inclusion criteria met, separated by ; : closed loop, self-reference, accumulation (a paper meeting only the closed loop is an R0 borderline case)
criteria: closed loop; accumulation

# What is improved: prompts, skill library, scaffold code, weights, ...
object: External artifacts only: the meta agent designs new agents in code (their forward function); the meta agent itself does not change

# Self-reference depth: R0 External artifacts only / R1 Prompts, memory, skill and tool libraries / R2 Scaffold and own code / R3 Weights and training pipeline / R4 The improvement process itself
R: R0

# Evidence for the depth: section and quotation from the paper
r_evidence: Section 3: “adopt FMs as meta agents to iteratively program interestingly new agents based on an ever-growing archive of previous discoveries”; the meta agent (GPT-4) and its prompt are fixed throughout the search (Appendix B); Section 6 lists improving the meta agent as future work: “ADAS can become self-referential where the meta agent can be improved through ADAS as well”

# Feedback source(s), separated by ; : formal verification, automated evaluation, simulation, real-world experiment, human review, learned judge, self-evaluation
feedback: automated evaluation

# Loop automation: human-in-the-loop / semi-automatic / fully automatic
loop: fully automatic

# Accumulation: single round / multi-generation single lineage / open-ended population or archive
accumulation: open-ended population or archive

# Improvement rounds: rounds or generations reported in the paper, or 'not reported'
rounds: ARC: 25 iterations (Section 4.1); DROP, MGSM, MMLU and GPQA: 30 iterations each (Section 4.2)

# Verification cost (only as reported, never inferred): seconds to minutes / hours / days to weeks / months or longer, or requires humans / not reported
cost: not reported

# Failure reversibility: fully reversible / retryable at a cost / irreversible
reversibility: fully reversible

# Authors' claim, from the title and abstract: RSI / self-improvement / not claimed; add an explicit disclaimer in parentheses, e.g. self-improvement (states it is not recursive)
claim: not claimed (Section 6 lists self-improvement of the meta agent as future work)

# Evidence strength: in-task / cross-task / cross-task, independently verified
evidence: cross-task

# Main result: one sentence with numbers
result: DROP F1 79.4 (best hand-designed baseline 65.8, prompt optimization with OPRO 69.1); MGSM 53.4% (LLM Debate 39.0%); ARC 13.7% (COT-SC 8.0%, GPT-3.5); the agent found on MGSM transfers to GSM8K at 69.5% (best baseline 43.6%) (Tables 1-3)

# Failures and limitations: as reported in the paper
limits: Evaluated only on one-step question-answering tasks (Section 6); optimizes a single objective (performance); the evaluation function looks only at a numeric score, which is costly and loses information (Section 6, Appendix J); gains are small in the science and multi-task domains, which the authors attribute to the base model lacking knowledge (Section 4.2); agents found in the math domain do worse in other domains than agents searched for those domains, and only match the baselines in the science domain (Appendix A, Table 5); the best agent on GPT-3.5 is no longer the best when moved to stronger models (Section 6); in the math domain, starting from an empty archive works better, for reasons not investigated (Appendix I); all datasets are sampled subsets (Appendices D and E)

# Reading depth: full text / partial text / abstract only (abstract-only annotations cannot be confirmed)
reading: partial text

# Your confidence in this annotation: high / medium / low
confidence: medium

# Notes: sources for the other fields, feedback details, open questions
notes: Feedback details: automated evaluation; each new agent's accuracy or F1 on the target domain's validation set is written into the archive for the meta agent to consult in the next iteration (Section 3: “we calculate the performance ... as the metrics for the meta agent to maximize”); every new agent is added to the archive and none is removed (Appendix H, Algorithm 1, line 12). The meta agent also runs two rounds of self-reflection to check novelty and self-corrects up to 5 times on errors; these do not decide what is kept. Loop: people only write the framework code, the domain descriptions and the initial seed agents (Section 3, Appendix B); Section 6 mentions “thorough manual inspections” of the generated code as a safety measure, and the paper does not say whether this is inside the loop. Evidence: Tables 2, 4 and 5 transfer to math and non-math benchmarks not used in the search, and Table 3 transfers to other base models; all evaluations were run by the authors. Verification cost: Appendix J reports only the API cost per run (about USD 500 for ARC, about USD 300 for the other domains), not the time. Publication status: the first page of the PDF reads “Published as a conference paper at ICLR 2025”. Reading: main text and Appendices A, B (in part), E (beginning), H, I and J read; Appendices C, D, F and G contain framework code, ARC details and example agent code, and were only skimmed for structure

# Points for the confirmer to check. For each: the specific question, the options (with the evidence for each), your recommendation and why, and where in the paper to look.
# Shown as-is on the issue page. Multi-line Markdown is fine; indent every line by two spaces.
review_points: |
  1. **Self-reference depth: decided by the maintainer as R0.** The current definition stays: a change counts as self-reference only if the modified part takes part in later improvement. Here the meta agent (GPT-4 with a fixed prompt) does all the improving and never changes; the task agents it designs do not design anything. The archive is the designed artifacts and their scores, not an experience library of the meta agent. This matches rule "A meta-agent designs other agents and does not change itself → R0", and the authors draw the same line: Section 6 calls the meta agent being improved through ADAS the step that would make it self-referential.
  2. **Should domain tag 2 (Natural sciences) be added?** (affects: tags, subclass; see Sections 4.2 and 4.3)
     - A. 0;2, subfields "Agent self-improvement; Mathematics": one of the core experiments is MGSM math, all transfer experiments are on math benchmarks (GSM8K, GSM-Hard, SVAMP, ASDiv), and there is also GPQA science QA. This matches P001 STaR, which got tag 2 for arithmetic and GSM8K.
     - B. Tag 0 only: these are all general reasoning benchmarks, and the paper aims at general agent design, not a particular scientific domain.
     - **Recommendation: A.** The rule is to tag by the domain of the experimental tasks. If you think GPQA should also be reflected, "Cross-subfield" could be added as a subfield, but I do not recommend it: GPQA is only one of four domains and shows the smallest gain.
  3. **Is the evidence strength cross-task or in-task?** (affects: evidence; see Section 4.3, Tables 2-5)
     - A. cross-task: the agent found on MGSM still beats the hand-designed baselines after transfer to GSM8K, GSM-Hard, SVAMP, ASDiv, MMLU and DROP, which were not used in the search (Tables 2, 4 and 5); the ARC agents also hold up on Claude-Haiku, GPT-4 and Claude-Sonnet (Table 3).
     - B. in-task: the main results in Table 1 come from a separate search per domain, tested on the held-out test set of the same benchmark.
     - **Recommendation: A.** The rule asks whether the improvement holds on other benchmarks not used for tuning, which Tables 2 to 5 show. Note that what this shows is that the artifacts transfer, not that the improvement process gets better, since this is R0. It is not independently verified; the authors ran the evaluations themselves.
  4. **Should the reading depth be "full text" or "partial text"?** (affects: reading; either can be confirmed)
     - A. partial text: Appendices C, D, F and G (framework code, ARC experiment details, baselines and example agent code) were only skimmed for structure.
     - B. full text: the main text and every appendix relevant to the annotation (A transfer, B prompts, H pseudocode, I initialization, J cost) were read.
     - **Recommendation: A.** It honestly reflects the parts not read, and "partial text" can be confirmed just the same.
  5. **Is "not reported" right for the verification cost?** (affects: cost; see Appendix J)
     - A. not reported: Appendix J gives only the API cost per run (about USD 500 for ARC, about USD 300 for the others), not how long it takes to evaluate one agent.
     - B. hours: inferred from evaluating 128 to 800 questions per iteration.
     - **Recommendation: A.** This field records time, which the paper does not report, and the "do not infer" rule rules out B. The cost in dollars is in the notes.

  Reading: the main text was read in full; Appendices A, B (in part), E (beginning), H, I and J were read; C, D, F and G were only skimmed for structure.

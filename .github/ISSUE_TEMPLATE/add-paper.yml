name: Recommend a paper
description: Recommend a paper that applies RSI (recursive self-improvement)
title: "[Paper] "
labels: ["paper"]
body:
  - type: markdown
    attributes:
      value: |
        Only say which paper it is and why it belongs in the list. The full annotation is written on a
        branch by whoever takes the paper, after reading it, and a confirmer then checks it on this issue
        page and comments `/confirm`. See [CONTRIBUTING.md](https://github.com/JasonDZS/awesome-rsi-applications/blob/main/CONTRIBUTING.md).
  - type: input
    id: title
    attributes:
      label: Paper title
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link
      description: "Prefer the arXiv abstract page, e.g. https://arxiv.org/abs/2505.22954"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why it belongs in the list
      description: "What its improvement loop is, which application domain it is in, and why it is relevant. One or two sentences."
    validations:
      required: true
  - type: checkboxes
    id: tags
    attributes:
      label: Domain tags
      description: "Optional; select any that apply. If unsure, leave them for the annotator."
      options:
        - label: "0 AI R&D itself"
        - label: "1 Engineering"
        - label: "2 Natural sciences"
        - label: "3 Physical and embodied systems"
        - label: "4 Social sciences"
  - type: textarea
    id: annotation
    attributes:
      label: Annotation
      description: "Optional. Leave empty unless you already have a complete annotation (for example from the annotation page): paste it here and the workflow creates the branch and the pull request for you."
      render: yaml

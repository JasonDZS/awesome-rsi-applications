name: 推荐论文
description: 推荐一篇 RSI（递归自我改进）应用方向的论文
title: "[论文] "
labels: ["论文"]
body:
  - type: markdown
    attributes:
      value: |
        这里只需要说明是哪篇论文、为什么值得收录。详细标注由认领的人读完原文后在分支里填写，
        再由确认人在本 Issue 页面核对并评论 `/confirm`。流程见 [CONTRIBUTING.md](https://github.com/JasonDZS/awesome-rsi-applications/blob/main/CONTRIBUTING.md)。
  - type: input
    id: title
    attributes:
      label: 论文标题
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 链接
      description: "优先 arXiv 摘要页，例如 https://arxiv.org/abs/2505.22954"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 推荐理由
      description: "它的改进回路是什么，在哪个应用领域，为什么和这份清单有关。一两句即可。"
    validations:
      required: true
  - type: checkboxes
    id: tags
    attributes:
      label: 领域标签
      description: "可选，可多选；拿不准可以不选，由填写人判断。"
      options:
        - label: "0 AI 研发自身"
        - label: "1 工程科学"
        - label: "2 自然科学"
        - label: "3 物理与具身"
        - label: "4 社会科学"

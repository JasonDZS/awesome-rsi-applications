name: check-data
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data
        if: github.event_name != 'pull_request'
        run: python3 scripts/check_data.py
      - name: Validate data (confirmation columns must not be edited by hand)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch -q --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:data/papers.tsv > "$RUNNER_TEMP/base.tsv"
          python3 scripts/check_data.py --base "$RUNNER_TEMP/base.tsv"
      - name: README is up to date
        run: |
          python3 scripts/build_readme.py
          git diff --exit-code README.md

# An issue that carries a complete annotation (an "Annotation" section, as written by the annotation
# page or pasted into the form) gets its branch, annotation file and pull request created here.
# The issue text is read as data only, by the default branch's scripts.
name: paper-intake
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: paper-intake-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  intake:
    if: ${{ !github.event.issue.pull_request && github.event.issue.state == 'open' && contains(github.event.issue.body, '### Annotation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create the branch and the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          OLD_BODY: ${{ github.event.changes.body.from }}
          ACTION: ${{ github.event.action }}
          AUTHOR: ${{ github.event.issue.user.login }}
          AUTHOR_ID: ${{ github.event.issue.user.id }}
          ASSOCIATION: ${{ github.event.issue.author_association }}
        run: |
          set -euo pipefail
          say() { gh issue comment "$ISSUE" --repo "$REPO" --body "$1"; }
          file="data/pending/issue-$ISSUE.yml"
          branch="paper/issue-$ISSUE"
          new="$RUNNER_TEMP/issue-$ISSUE.yml"

          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          old=()
          if [ "$ACTION" = "edited" ]; then printf '%s' "$OLD_BODY" > "$RUNNER_TEMP/old.md"; old=(--old "$RUNNER_TEMP/old.md"); fi
          code=0
          python3 scripts/intake.py "$RUNNER_TEMP/body.md" --out "$new" "${old[@]}" > "$RUNNER_TEMP/intake.txt" || code=$?
          [ "$code" = "3" ] && exit 0

          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *) [ "$ACTION" = "opened" ] && say "Thanks for the annotation. Pull requests are created automatically only for collaborators; a maintainer will pick this one up."
               exit 0 ;;
          esac
          [ "$code" = "0" ] || { say "$(cat "$RUNNER_TEMP/intake.txt") Edit the issue to fix the Annotation section."; exit 0; }

          # rendered with the default branch's scripts, before switching branches
          python3 scripts/render_review.py "$new" --source "__SOURCE__" > "$RUNNER_TEMP/review.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin "refs/heads/$branch" 2>/dev/null; then
            if git show "FETCH_HEAD:$file" 2>/dev/null | cmp -s - "$new"; then echo "branch already has this annotation"; else
              git switch -q -C "$branch" FETCH_HEAD
            fi
          else
            git switch -q -c "$branch"
          fi
          if [ "$(git rev-parse --abbrev-ref HEAD)" = "$branch" ]; then
            mkdir -p data/pending && cp "$new" "$file"
            git add "$file"
            {
              echo "Annotate paper for #$ISSUE"
              echo
              echo "Annotation taken from the issue as submitted by @$AUTHOR."
              echo
              echo "Co-authored-by: $AUTHOR <$AUTHOR_ID+$AUTHOR@users.noreply.github.com>"
            } > "$RUNNER_TEMP/msg.txt"
            git commit -q -F "$RUNNER_TEMP/msg.txt"
            git push -q origin "HEAD:refs/heads/$branch"
            sha=$(git rev-parse HEAD)
          else
            sha=$(git rev-parse FETCH_HEAD)
          fi

          pr=$(gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$branch" --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            short=${ISSUE_TITLE#\[Paper\] }
            printf '## Issue\n\n#%s\n\nThis pull request contains only `%s`. It was created automatically from the annotation in the issue, submitted by @%s.\n\nA confirmer checks the annotation on the issue page and comments `/confirm` **on issue #%s** (not here); this pull request is then closed automatically and the workflow adds the paper to the list.\n' \
              "$ISSUE" "$file" "$AUTHOR" "$ISSUE" > "$RUNNER_TEMP/pr.md"
            if ! pr=$(gh api "repos/$REPO/pulls" -f title="Annotate paper for #$ISSUE: ${short%%:*}" -f head="$branch" -f base="$BASE" \
                        -F body=@"$RUNNER_TEMP/pr.md" --jq .number 2> "$RUNNER_TEMP/pr-err.txt"); then
              cat "$RUNNER_TEMP/pr-err.txt"
              say "The branch \`$branch\` is ready, but the workflow could not open the pull request. [Open it here](https://github.com/$REPO/compare/$BASE...$branch?expand=1). To let the workflow do this itself, a maintainer can enable *Settings → Actions → General → Allow GitHub Actions to create and approve pull requests*."
              exit 0
            fi
          fi

          # show the annotation on the issue page (a pull request opened by this workflow does not trigger paper-review)
          {
            sed "s|__SOURCE__|Submitted by @$AUTHOR in this issue; pull request #$pr (commit ${sha:0:7}).|" "$RUNNER_TEMP/review.md"
            echo
            echo "<!-- paper-review pr=$pr sha=$sha -->"
          } > "$RUNNER_TEMP/comment.md"
          gh api "repos/$REPO/issues/$ISSUE/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- paper-review "))) | .id' \
            | while read -r id; do gh api -X DELETE "repos/$REPO/issues/comments/$id"; done
          say "$(cat "$RUNNER_TEMP/comment.md")"
